<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e1117; font-family: 'Outfit', sans-serif; overflow: hidden; }
  #container { position: relative; width: 100%; height: __HEIGHT__px; }
  canvas { display: block; width: 100%; height: 100%; }

  #controls {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: rgba(30,41,59,0.92); border: 1px solid rgba(100,116,139,0.3);
    border-radius: 10px; padding: 8px 16px; backdrop-filter: blur(8px);
  }
  #controls button {
    background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.3);
    color: #4ade80; border-radius: 6px; padding: 4px 12px; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  #controls button:hover { background: rgba(74,222,128,0.3); }
  #scrubber { width: 180px; accent-color: #4ade80; cursor: pointer; }
  #frame-label { color: #94a3b8; font-size: 12px; min-width: 70px; text-align: center; }
  #phase-badge {
    padding: 2px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
    min-width: 90px; text-align: center;
  }
  #speed-select {
    background: #1e293b; color: #94a3b8; border: 1px solid #334155;
    border-radius: 4px; padding: 2px 6px; font-size: 12px;
  }

  /* Comparison mode labels */
  .viewport-label {
    position: absolute; top: 10px; color: rgba(148,163,184,0.8);
    font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
    pointer-events: none;
  }
  #label-left { left: 15px; }
  #label-right { right: 15px; }

  /* Loading overlay */
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #4ade80; font-size: 15px; font-weight: 600; letter-spacing: 0.5px;
    background: rgba(14,17,23,0.85); padding: 12px 24px; border-radius: 8px;
    border: 1px solid rgba(74,222,128,0.3); pointer-events: none;
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="viewer"></canvas>
  <div id="loading">Loading 3D model…</div>
  <div id="controls">
    <button id="play-btn">Play</button>
    <input id="scrubber" type="range" min="0" max="100" value="0">
    <span id="frame-label">0 / 0</span>
    <span id="phase-badge"></span>
    <select id="speed-select">
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
    </select>
    <button id="reset-cam-btn">Reset Cam</button>
  </div>
  <span id="label-left" class="viewport-label" style="display:none;">Student</span>
  <span id="label-right" class="viewport-label" style="display:none;">Pro</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ── Injected data ──
const poseData = __POSE_DATA__;
const clubData = __CLUB_DATA__;
const phaseData = __PHASE_DATA__;
const phaseColors = __PHASE_COLORS__;
const MODE = "__MODE__";
const comparisonPose = __COMPARISON_POSE__;
const comparisonClub = __COMPARISON_CLUB__;
const dtwAlignment = __DTW_ALIGNMENT__;

const TOTAL = poseData.length;
const MODEL_URL = "__MODEL_URL__";

// ── Scene setup ──
const canvas = document.getElementById('viewer');
const container = document.getElementById('container');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x0e1117);
renderer.shadowMap.enabled = true;

const isComparison = MODE === 'comparison' && comparisonPose && comparisonPose.length > 0;

// Camera & controls
const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.01, 50);
camera.position.set(0, 0.5, 3.0);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// Second camera for comparison
let camera2, controls2;
if (isComparison) {
  camera2 = new THREE.PerspectiveCamera(50, (container.clientWidth / 2) / container.clientHeight, 0.01, 50);
  camera2.position.set(0, 0.5, 3.0);
  controls2 = new OrbitControls(camera2, canvas);
  controls2.target.set(0, 0.8, 0);
  controls2.enableDamping = true;
  controls2.dampingFactor = 0.08;
  controls2.update();
  document.getElementById('label-left').style.display = 'block';
  document.getElementById('label-right').style.display = 'block';
}

// ── Scene infrastructure (lights, grid, club, trail) ──
function createSceneInfrastructure() {
  const scene = new THREE.Scene();

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(3, 5, 3);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0x8080ff, 0.3);
  fillLight.position.set(-3, 2, -2);
  scene.add(fillLight);

  // Ground grid (Y-position adjusted after model loads to align with feet)
  const grid = new THREE.GridHelper(6, 30, 0x334155, 0x1e293b);
  scene.add(grid);

  // Club shaft
  const shaftGeo = new THREE.CylinderGeometry(0.008, 0.008, 1, 8);
  shaftGeo.translate(0, 0.5, 0);
  const shaftMat = new THREE.MeshPhongMaterial({ color: 0xc0c0c0 });
  const shaft = new THREE.Mesh(shaftGeo, shaftMat);
  shaft.visible = false;
  scene.add(shaft);

  // Clubhead
  const headGeo = new THREE.BoxGeometry(0.06, 0.02, 0.04);
  const headMat = new THREE.MeshPhongMaterial({ color: 0x888888 });
  const clubhead = new THREE.Mesh(headGeo, headMat);
  clubhead.visible = false;
  scene.add(clubhead);

  // Swing trail
  const trailMax = 40;
  const trailPositions = new Float32Array(trailMax * 3);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
  trailGeo.setDrawRange(0, 0);
  const trailMat = new THREE.LineBasicMaterial({ color: 0xfb5607, transparent: true, opacity: 0.7 });
  const trail = new THREE.Line(trailGeo, trailMat);
  scene.add(trail);

  return {
    scene,
    soldierModel: null,
    soldierBones: {},
    hipRestY: 0,
    grid,
    shaft, clubhead, trail, trailPositions,
    trailCount: 0, trailMax,
  };
}

const mainScene = createSceneInfrastructure();
let compScene = null;
if (isComparison) compScene = createSceneInfrastructure();

// ── Bone retargeting data (populated once after GLB load) ──
const restAxis = {};    // boneName → Vector3 (world rest direction bone→firstChild)
const restWorldQ = {};  // boneName → Quaternion (bone world quaternion at rest)

// Auto-detected Mixamo bone prefix ('mixamorig:' or 'mixamorig' etc.)
let MIXAMO_PREFIX = 'mixamorig:';
// Helper: resolve full bone name from short suffix
function B(suffix) { return MIXAMO_PREFIX + suffix; }

function cacheRestData(model) {
  model.updateMatrixWorld(true);
  model.traverse(obj => {
    if (!obj.isBone || restAxis[obj.name]) return; // only cache once
    const wq = new THREE.Quaternion();
    obj.getWorldQuaternion(wq);
    restWorldQ[obj.name] = wq.clone();

    const boneKids = obj.children.filter(c => c.isBone);
    if (boneKids.length > 0) {
      const bp = new THREE.Vector3(), cp = new THREE.Vector3();
      obj.getWorldPosition(bp);
      boneKids[0].getWorldPosition(cp);
      const d = cp.clone().sub(bp);
      restAxis[obj.name] = d.lengthSq() > 1e-10 ? d.normalize() : new THREE.Vector3(0, 1, 0);
    } else {
      restAxis[obj.name] = new THREE.Vector3(0, 1, 0);
    }
  });
}

function buildBoneMap(model) {
  const bones = {};
  model.traverse(obj => { if (obj.isBone) bones[obj.name] = obj; });
  return bones;
}

// Apply a world-space quaternion to a bone (converts to local space)
function setBoneWorldQ(bone, worldQ) {
  const parentWorldQ = new THREE.Quaternion();
  if (bone.parent) bone.parent.getWorldQuaternion(parentWorldQ);
  bone.quaternion.copy(parentWorldQ.clone().invert().multiply(worldQ));
}

// Drive a bone so it points from fromDir toward toDir (targetDir = to - from)
function driveBone(bones, boneName, targetDir) {
  const bone = bones[boneName];
  const rAxis = restAxis[boneName];
  const rWorldQ = restWorldQ[boneName];
  if (!bone || !rAxis || !rWorldQ || targetDir.lengthSq() < 1e-8) return;

  const td = targetDir.clone().normalize();
  // Rotate restAxis → td in world space, applied on top of rest world quaternion
  const R = new THREE.Quaternion().setFromUnitVectors(rAxis, td);
  const desiredWorldQ = rWorldQ.clone().premultiply(R); // R * rWorldQ
  setBoneWorldQ(bone, desiredWorldQ);
  bone.updateMatrix(); // sync matrix from new quaternion (handles matrixAutoUpdate=false)
  bone.updateMatrixWorld(true);
}

// ── Load Soldier.glb ──
const loader = new GLTFLoader();
loader.load(
  MODEL_URL,
  (gltf) => {
    const originalScene = gltf.scene;

    // Rotate 180° around Y so the model's left/right axes align with
    // MediaPipe world space (MediaPipe X+ = subject's right; Xbot X+ = model's left).
    originalScene.rotation.y = Math.PI;

    // Enable shadows on all meshes
    originalScene.traverse(obj => {
      if (obj.isMesh || obj.isSkinnedMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });

    // Auto-detect Mixamo bone naming prefix ('mixamorig:Hips' vs 'mixamorigHips' etc.)
    originalScene.traverse(obj => {
      if (!obj.isBone) return;
      const hipsIdx = obj.name.indexOf('Hips');
      if (hipsIdx >= 0) MIXAMO_PREFIX = obj.name.slice(0, hipsIdx);
    });

    // Cache rest pose data after rotation so axes already match MediaPipe space.
    cacheRestData(originalScene);

    // Hip rest Y offset (world Y of Hips bone in rest pose)
    let hipRestY = 0;
    originalScene.traverse(obj => {
      if (obj.isBone && obj.name === B('Hips')) {
        const p = new THREE.Vector3();
        obj.getWorldPosition(p);
        hipRestY = p.y;
      }
    });

    // Set up main scene model
    mainScene.soldierModel = originalScene;
    mainScene.soldierBones = buildBoneMap(originalScene);
    mainScene.hipRestY = hipRestY;
    mainScene.grid.position.y = -hipRestY; // align grid with model feet
    mainScene.scene.add(originalScene);

    // Set up comparison scene model (independent clone)
    if (compScene) {
      const clone = SkeletonUtils.clone(originalScene);
      clone.traverse(obj => {
        if (obj.isMesh || obj.isSkinnedMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          // Clone material so phase color is independent
          if (obj.material) obj.material = obj.material.clone();
        }
      });
      compScene.soldierModel = clone;
      compScene.soldierBones = buildBoneMap(clone);
      compScene.hipRestY = hipRestY;
      compScene.grid.position.y = -hipRestY;
      compScene.scene.add(clone);
    }

    document.getElementById('loading').style.display = 'none';
    animate(performance.now());
  },
  undefined,
  (err) => {
    console.error('Soldier.glb load error:', err);
    document.getElementById('loading').textContent = 'Failed to load 3D model.';
  }
);

// ── Landmark helpers ──
function getLM(landmarks, idx) {
  const l = landmarks.find(l => l.idx === idx);
  return (l && l.x !== null) ? new THREE.Vector3(l.x, -l.y, -l.z) : null;
}

function avgPts(...pts) {
  const valid = pts.filter(Boolean);
  if (!valid.length) return null;
  const s = new THREE.Vector3();
  valid.forEach(p => s.add(p));
  return s.divideScalar(valid.length);
}

function lerpPts(a, b, t) {
  return (a && b) ? a.clone().lerp(b, t) : null;
}

// ── Update skeleton (Soldier model driven by landmarks) ──
function updateSkeleton(sceneObj, frameData, clubFrame) {
  if (!sceneObj.soldierModel) return;

  const lms = frameData.landmarks || [];
  const lm = i => getLM(lms, i);

  const bones = sceneObj.soldierBones;
  const model = sceneObj.soldierModel;

  // Key landmark positions (THREE.js Y-up space)
  const lm0  = lm(0);
  const lm9  = lm(9),  lm10 = lm(10);
  const lm11 = lm(11), lm12 = lm(12);
  const lm13 = lm(13), lm14 = lm(14);
  const lm15 = lm(15), lm16 = lm(16);
  const lm23 = lm(23), lm24 = lm(24);
  const lm25 = lm(25), lm26 = lm(26);
  const lm27 = lm(27), lm28 = lm(28);
  const lm31 = lm(31), lm32 = lm(32);

  const hipCtr      = avgPts(lm23, lm24);
  const shoulderCtr = avgPts(lm11, lm12);
  const mouthCtr    = avgPts(lm9, lm10);

  // Position model root so hip bone aligns with MediaPipe hip center
  if (hipCtr) {
    model.position.set(hipCtr.x, hipCtr.y - sceneObj.hipRestY, hipCtr.z);
    model.updateMatrixWorld(true);
  }

  // Spine (interpolate along hip→shoulder axis)
  const sp1 = lerpPts(hipCtr, shoulderCtr, 0.33);
  const sp2 = lerpPts(hipCtr, shoulderCtr, 0.66);

  const drive = (name, from, to) => {
    if (from && to) driveBone(bones, name, to.clone().sub(from));
  };

  // Spine chain (parent → child order is critical)
  drive(B('Spine'),  hipCtr,      sp1);
  drive(B('Spine1'), sp1,         sp2);
  drive(B('Spine2'), sp2,         shoulderCtr);
  // Head/neck
  drive(B('Neck'),   shoulderCtr, mouthCtr);
  drive(B('Head'),   mouthCtr,    lm0);
  // Left arm chain
  drive(B('LeftShoulder'),  shoulderCtr, lm11);
  drive(B('LeftArm'),       lm11,        lm13);
  drive(B('LeftForeArm'),   lm13,        lm15);
  // Right arm chain
  drive(B('RightShoulder'), shoulderCtr, lm12);
  drive(B('RightArm'),      lm12,        lm14);
  drive(B('RightForeArm'),  lm14,        lm16);
  // Leg chains — after the 180° Y rotation the model's anatomical "Left" bone
  // sits on the camera's LEFT = subject's RIGHT side, so drive it with the
  // subject's RIGHT leg landmarks (lm24/26/28/32), and vice-versa.
  drive(B('LeftUpLeg'), lm24, lm26);
  drive(B('LeftLeg'),   lm26, lm28);
  drive(B('LeftFoot'),  lm28, lm32);
  drive(B('RightUpLeg'), lm23, lm25);
  drive(B('RightLeg'),   lm25, lm27);
  drive(B('RightFoot'),  lm27, lm31);

  // Club shaft + head + swing trail (unchanged from original)
  if (clubFrame && clubFrame.has_club && clubFrame.grip && clubFrame.shaft_end) {
    const grip = new THREE.Vector3(clubFrame.grip.x, -clubFrame.grip.y, -clubFrame.grip.z);
    const end  = new THREE.Vector3(clubFrame.shaft_end.x, -clubFrame.shaft_end.y, -clubFrame.shaft_end.z);
    const dir  = new THREE.Vector3().subVectors(end, grip);
    const len  = dir.length();

    sceneObj.shaft.position.copy(grip);
    sceneObj.shaft.scale.set(1, len, 1);
    sceneObj.shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    sceneObj.shaft.visible = true;

    sceneObj.clubhead.position.copy(end);
    sceneObj.clubhead.visible = true;

    // Trail
    const tp = sceneObj.trailPositions;
    if (sceneObj.trailCount < sceneObj.trailMax) {
      const idx = sceneObj.trailCount;
      tp[idx * 3] = end.x; tp[idx * 3 + 1] = end.y; tp[idx * 3 + 2] = end.z;
      sceneObj.trailCount++;
    } else {
      for (let i = 0; i < (sceneObj.trailMax - 1) * 3; i++) tp[i] = tp[i + 3];
      const last = (sceneObj.trailMax - 1) * 3;
      tp[last] = end.x; tp[last + 1] = end.y; tp[last + 2] = end.z;
    }
    sceneObj.trail.geometry.attributes.position.needsUpdate = true;
    sceneObj.trail.geometry.setDrawRange(0, Math.min(sceneObj.trailCount, sceneObj.trailMax));
  } else {
    sceneObj.shaft.visible = false;
    sceneObj.clubhead.visible = false;
  }

  // Push driven bone matrices into SkinnedMesh GPU skinning buffers
  model.traverse(obj => {
    if (obj.isSkinnedMesh) obj.skeleton.update();
  });
}

// ── Phase color → tint Soldier's SkinnedMesh materials ──
function applyPhaseColor(sceneObj, frameIdx) {
  let phaseColor = 0x4ade80;
  for (const [phase, range] of Object.entries(phaseData)) {
    if (frameIdx >= range.start && frameIdx <= range.end) {
      phaseColor = parseInt((phaseColors[phase] || '#4ade80').replace('#', ''), 16);
      phaseBadge.textContent = phase;
      phaseBadge.style.background = phaseColors[phase] + '26';
      phaseBadge.style.color = phaseColors[phase];
      phaseBadge.style.border = '1px solid ' + phaseColors[phase] + '4d';
      break;
    }
  }
  if (sceneObj.soldierModel) {
    sceneObj.soldierModel.traverse(obj => {
      if ((obj.isMesh || obj.isSkinnedMesh) && obj.material) {
        obj.material.color.setHex(phaseColor);
      }
    });
  }
}

// Map student frame to pro frame via DTW alignment
function getComparisonFrame(studentFrameIdx) {
  if (dtwAlignment && typeof dtwAlignment === 'object') {
    for (const [phase, alignment] of Object.entries(dtwAlignment)) {
      const pRange = phaseData[phase];
      if (pRange && studentFrameIdx >= pRange.start && studentFrameIdx <= pRange.end) {
        const t = (pRange.end > pRange.start)
          ? (studentFrameIdx - pRange.start) / (pRange.end - pRange.start) : 0;
        const proIdx = Math.round(alignment[0] + t * (alignment[1] - alignment[0]));
        return Math.min(Math.max(proIdx, 0), comparisonPose.length - 1);
      }
    }
  }
  const ratio = studentFrameIdx / Math.max(TOTAL - 1, 1);
  return Math.min(Math.round(ratio * (comparisonPose.length - 1)), comparisonPose.length - 1);
}

// ── Controls ──
const playBtn     = document.getElementById('play-btn');
const scrubber    = document.getElementById('scrubber');
const frameLabel  = document.getElementById('frame-label');
const phaseBadge  = document.getElementById('phase-badge');
const speedSelect = document.getElementById('speed-select');
const resetCamBtn = document.getElementById('reset-cam-btn');

scrubber.max = TOTAL - 1;
let currentFrame = 0;
let playing = false;
let playbackSpeed = 1.0;
let lastTime = 0;
let accumulator = 0;

const fps = (TOTAL > 1 && poseData[1].timestamp_ms > 0)
  ? 1000 / (poseData[1].timestamp_ms - poseData[0].timestamp_ms) : 30;

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Play';
  if (playing) { lastTime = performance.now(); accumulator = 0; }
});

scrubber.addEventListener('input', () => {
  currentFrame = parseInt(scrubber.value);
  resetTrail(mainScene);
  if (compScene) resetTrail(compScene);
});

speedSelect.addEventListener('change', () => {
  playbackSpeed = parseFloat(speedSelect.value);
});

resetCamBtn.addEventListener('click', () => {
  camera.position.set(0, 0.5, 3.0);
  controls.target.set(0, 0.8, 0);
  controls.update();
  if (camera2) {
    camera2.position.set(0, 0.5, 3.0);
    controls2.target.set(0, 0.8, 0);
    controls2.update();
  }
});

function resetTrail(sceneObj) {
  sceneObj.trailCount = 0;
  sceneObj.trail.geometry.setDrawRange(0, 0);
}

// ── Animation loop (started after GLB loads) ──
function animate(time) {
  requestAnimationFrame(animate);

  if (playing) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    accumulator += dt * playbackSpeed * fps;
    if (accumulator >= 1) {
      const step = Math.floor(accumulator);
      currentFrame = (currentFrame + step) % TOTAL;
      accumulator -= step;
    }
  }

  const fi = Math.floor(currentFrame);

  updateSkeleton(mainScene, poseData[fi], clubData[fi]);
  applyPhaseColor(mainScene, fi);

  scrubber.value = fi;
  frameLabel.textContent = `${fi} / ${TOTAL - 1}`;

  controls.update();

  if (isComparison) {
    const w = container.clientWidth;
    const h = container.clientHeight;
    const halfW = Math.floor(w / 2);

    const compIdx = getComparisonFrame(fi);
    updateSkeleton(compScene, comparisonPose[compIdx], comparisonClub[compIdx]);
    applyPhaseColor(compScene, compIdx);

    renderer.setScissorTest(true);

    renderer.setViewport(0, 0, halfW, h);
    renderer.setScissor(0, 0, halfW, h);
    camera.aspect = halfW / h;
    camera.updateProjectionMatrix();
    renderer.render(mainScene.scene, camera);

    renderer.setViewport(halfW, 0, w - halfW, h);
    renderer.setScissor(halfW, 0, w - halfW, h);
    camera2.aspect = (w - halfW) / h;
    camera2.updateProjectionMatrix();
    renderer.render(compScene.scene, camera2);

    renderer.setScissorTest(false);
    controls2.update();
  } else {
    renderer.render(mainScene.scene, camera);
  }
}

// Handle resize
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w, h);
  if (!isComparison) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
});
</script>
</body>
</html>
