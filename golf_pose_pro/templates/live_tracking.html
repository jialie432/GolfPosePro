<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e1117; font-family: 'Outfit', sans-serif; overflow: hidden; }
  #container { position: relative; width: 100%; height: __HEIGHT__px; display: flex; }

  #video-panel {
    width: 240px; min-width: 240px; position: relative;
    background: #1e293b; border-right: 1px solid #334155;
    display: flex; flex-direction: column; align-items: center; padding: 10px;
  }
  #webcam {
    width: 220px; height: 165px; border-radius: 8px;
    background: #0e1117; object-fit: cover;
  }
  #status {
    color: #94a3b8; font-size: 12px; margin-top: 8px; text-align: center;
  }
  #start-btn {
    margin-top: 12px; padding: 8px 20px; border-radius: 8px;
    background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.3);
    color: #4ade80; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #start-btn:hover { background: rgba(74,222,128,0.3); }
  #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #canvas-panel { flex: 1; position: relative; }
  #viewer { width: 100%; height: 100%; display: block; }

  #fps-badge {
    position: absolute; top: 10px; right: 10px;
    background: rgba(30,41,59,0.9); color: #94a3b8; font-size: 11px;
    padding: 3px 8px; border-radius: 4px; border: 1px solid #334155;
  }
</style>
</head>
<body>
<div id="container">
  <div id="video-panel">
    <video id="webcam" autoplay playsinline muted></video>
    <div id="status">Click Start to begin tracking</div>
    <button id="start-btn">Start Tracking</button>
  </div>
  <div id="canvas-panel">
    <canvas id="viewer"></canvas>
    <span id="fps-badge">-- FPS</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── MediaPipe Vision (loaded dynamically) ──
const MEDIAPIPE_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';

const CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],
  [23,25],[24,26],[25,27],[26,28],
  [27,29],[28,30],[27,31],[28,32],
  [15,17],[15,19],[15,21],
  [16,18],[16,20],[16,22],
];

// ── Three.js setup ──
const canvasPanel = document.getElementById('canvas-panel');
const canvas = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x0e1117);

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(2, -3, 4);
scene.add(dirLight);

const grid = new THREE.GridHelper(4, 20, 0x334155, 0x1e293b);
scene.add(grid);

const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 50);
camera.position.set(0, -0.5, 2.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, -0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Joints
const jointGeo = new THREE.SphereGeometry(0.015, 8, 8);
const joints = [];
for (let i = 0; i < 33; i++) {
  const m = new THREE.Mesh(jointGeo, new THREE.MeshPhongMaterial({ color: 0x4ade80 }));
  m.visible = false;
  scene.add(m);
  joints.push(m);
}

// Bones
const boneLines = [];
for (const [a, b] of CONNECTIONS) {
  const mat = new THREE.LineBasicMaterial({ color: 0x4ade80, linewidth: 2 });
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const line = new THREE.Line(geo, mat);
  line.visible = false;
  scene.add(line);
  boneLines.push({ line, a, b });
}

// Club
const shaftGeo = new THREE.CylinderGeometry(0.008, 0.008, 1, 8);
shaftGeo.translate(0, 0.5, 0);
const shaft = new THREE.Mesh(shaftGeo, new THREE.MeshPhongMaterial({ color: 0xc0c0c0 }));
shaft.visible = false;
scene.add(shaft);

const clubhead = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 0.02, 0.04),
  new THREE.MeshPhongMaterial({ color: 0x888888 })
);
clubhead.visible = false;
scene.add(clubhead);

function resizeRenderer() {
  const w = canvasPanel.clientWidth;
  const h = canvasPanel.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resizeRenderer();
window.addEventListener('resize', resizeRenderer);

// ── Update skeleton from world landmarks ──
function updateFromWorldLandmarks(worldLandmarks) {
  if (!worldLandmarks || worldLandmarks.length === 0) return;

  const lms = worldLandmarks;
  for (let i = 0; i < 33 && i < lms.length; i++) {
    const lm = lms[i];
    if (lm.visibility > 0.4) {
      joints[i].position.set(lm.x, -lm.y, -lm.z);
      joints[i].visible = true;
    } else {
      joints[i].visible = false;
    }
  }

  for (const bone of boneLines) {
    const ja = joints[bone.a];
    const jb = joints[bone.b];
    if (ja.visible && jb.visible) {
      const pos = bone.line.geometry.attributes.position;
      pos.setXYZ(0, ja.position.x, ja.position.y, ja.position.z);
      pos.setXYZ(1, jb.position.x, jb.position.y, jb.position.z);
      pos.needsUpdate = true;
      bone.line.visible = true;
    } else {
      bone.line.visible = false;
    }
  }

  // Estimate club from wrists and elbows
  const lw = lms[15], rw = lms[16], le = lms[13], re = lms[14];
  if (lw && rw && lw.visibility > 0.4 && rw.visibility > 0.4) {
    const grip = new THREE.Vector3(
      (lw.x + rw.x) / 2, -(lw.y + rw.y) / 2, -(lw.z + rw.z) / 2
    );

    let dir = new THREE.Vector3(0, -1, 0);
    if (le && re && le.visibility > 0.4 && re.visibility > 0.4) {
      const lf = new THREE.Vector3(lw.x - le.x, -(lw.y - le.y), -(lw.z - le.z)).normalize();
      const rf = new THREE.Vector3(rw.x - re.x, -(rw.y - re.y), -(rw.z - re.z)).normalize();
      const avg = lf.add(rf).normalize();
      const down = new THREE.Vector3(0, -1, 0);
      dir = avg.multiplyScalar(0.6).add(down.multiplyScalar(0.4)).normalize();
    }

    const clubLen = 0.9;
    const end = grip.clone().add(dir.multiplyScalar(clubLen));

    shaft.position.copy(grip);
    const shaftDir = new THREE.Vector3().subVectors(end, grip);
    shaft.scale.set(1, shaftDir.length(), 1);
    shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), shaftDir.normalize());
    shaft.visible = true;
    clubhead.position.copy(end);
    clubhead.visible = true;
  } else {
    shaft.visible = false;
    clubhead.visible = false;
  }
}

// ── FPS counter ──
let frameCount = 0;
let fpsTime = performance.now();
const fpsBadge = document.getElementById('fps-badge');

function updateFPS() {
  frameCount++;
  const now = performance.now();
  if (now - fpsTime >= 1000) {
    fpsBadge.textContent = `${frameCount} FPS`;
    frameCount = 0;
    fpsTime = now;
  }
}

// ── Animation loop ──
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  updateFPS();
}
animate();

// ── MediaPipe setup ──
const video = document.getElementById('webcam');
const startBtn = document.getElementById('start-btn');
const statusEl = document.getElementById('status');

let poseLandmarker = null;

async function initMediaPipe() {
  statusEl.textContent = 'Loading MediaPipe model...';
  startBtn.disabled = true;

  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
    const { PoseLandmarker, FilesetResolver } = vision;

    const wasmFileset = await FilesetResolver.forVisionTasks(MEDIAPIPE_CDN);

    poseLandmarker = await PoseLandmarker.createFromOptions(wasmFileset, {
      baseOptions: {
        modelAssetPath: MODEL_URL,
        delegate: 'GPU',
      },
      runningMode: 'VIDEO',
      numPoses: 1,
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });

    statusEl.textContent = 'Model loaded. Starting webcam...';
    await startWebcam();
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    startBtn.disabled = false;
    console.error(err);
  }
}

async function startWebcam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 },
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = 'Tracking active';
    startBtn.textContent = 'Stop';
    startBtn.disabled = false;
    processFrame();
  } catch (err) {
    statusEl.textContent = 'Webcam access denied';
    startBtn.disabled = false;
  }
}

let tracking = false;

function processFrame() {
  if (!tracking || !poseLandmarker) return;

  const now = performance.now();
  const result = poseLandmarker.detectForVideo(video, now);

  if (result.worldLandmarks && result.worldLandmarks.length > 0) {
    updateFromWorldLandmarks(result.worldLandmarks[0]);
  }

  requestAnimationFrame(processFrame);
}

startBtn.addEventListener('click', () => {
  if (!tracking) {
    tracking = true;
    if (!poseLandmarker) {
      initMediaPipe();
    } else {
      startWebcam();
    }
  } else {
    tracking = false;
    startBtn.textContent = 'Start Tracking';
    statusEl.textContent = 'Tracking stopped';
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
  }
});
</script>
</body>
</html>
